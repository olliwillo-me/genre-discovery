    function discoverShow(genreSlugs, excludeSlugs) {
      const now = new Date();
      const oneYearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
      const excludeSet = new Set(excludeSlugs || []);
      const genreSet = new Set(genreSlugs);

      const candidates = SEED_DATA.shows
        .filter(show => {
          if (excludeSet.has(show.slug)) return false;
          if (show.qualityScore < 0.5) return false;
          const pubDate = new Date(show.publishDate);
          if (pubDate < oneYearAgo) return false;
          return show.tags.some(t => genreSet.has(t));
        })
        .map(show => {
          const genreMatchCount = show.tags.filter(t => genreSet.has(t)).length;
          return { ...show, genreMatchCount };
        })
        .sort((a, b) => {
          if (b.genreMatchCount !== a.genreMatchCount) return b.genreMatchCount - a.genreMatchCount;
          return b.playCount - a.playCount;
        });

      if (candidates.length === 0) return null;
      const s = candidates[0];
      return {
        slug: s.slug,
        name: s.name,
        ownerInfo: { username: s.owner, displayName: s.displayName },
        qualityScore: s.qualityScore,
        playCount: s.playCount,
      };
    }

    // -----------------------------------------------------------------------
    // Genre Search Bar (in page content)
    // -----------------------------------------------------------------------
    function GenreSearchBar({ genres, onSelect }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const [highlightIdx, setHighlightIdx] = useState(0);
      const inputRef = useRef(null);
      const wrapperRef = useRef(null);

      const filtered = useMemo(() => {
        if (!query.trim()) return [];
        const q = query.toLowerCase();
        return genres.filter(g => g.name.toLowerCase().includes(q)).slice(0, 12);
      }, [genres, query]);

      useEffect(() => { setHighlightIdx(0); }, [filtered]);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); }
        else if (e.key === 'Enter' && filtered[highlightIdx]) { e.preventDefault(); onSelect(filtered[highlightIdx].slug); setQuery(''); setOpen(false); }
        else if (e.key === 'Escape') { setOpen(false); }
      };

      return (
        <div ref={wrapperRef} style={{ position: 'relative', marginBottom: '24px' }}>
          <div style={searchBarS.bar}>
            <Icons.search size={18} color="#999" />
            <input ref={inputRef} value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => { if (query.trim()) setOpen(true); }}
              onKeyDown={handleKeyDown}
              placeholder="Search for a genre or tag" style={searchBarS.input} />
          </div>
          {open && filtered.length > 0 && (
            <div style={searchBarS.dropdown}>
              {filtered.map((g, i) => (
                <div key={g.slug}
                  onClick={() => { onSelect(g.slug); setQuery(''); setOpen(false); }}
                  onMouseEnter={() => setHighlightIdx(i)}
                  style={{ ...searchBarS.dropdownItem, ...(i === highlightIdx ? { background: '#f5f5f5' } : {}) }}>
                  {g.name}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const searchBarS = {
      bar: { display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '8px', border: '1px solid #ddd', background: '#fff' },

    // -----------------------------------------------------------------------
    // Discovery genre picker (multi-select)
    // -----------------------------------------------------------------------
    function GenrePicker({ genres, selectedSlugs, onToggle }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const [highlightIdx, setHighlightIdx] = useState(0);
      const inputRef = useRef(null);
      const wrapperRef = useRef(null);

      const selectedGenres = useMemo(() => genres.filter(g => selectedSlugs.includes(g.slug)), [genres, selectedSlugs]);
      const filtered = useMemo(() => {
        const pool = genres.filter(g => !selectedSlugs.includes(g.slug));
        if (!query.trim()) return pool;
        return pool.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));
      }, [genres, query, selectedSlugs]);

      useEffect(() => { setHighlightIdx(0); }, [filtered]);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); }
        else if (e.key === 'Enter' && filtered[highlightIdx]) { e.preventDefault(); onToggle(filtered[highlightIdx].slug); setQuery(''); }
        else if (e.key === 'Backspace' && query === '' && selectedSlugs.length > 0) { onToggle(selectedSlugs[selectedSlugs.length - 1]); }
        else if (e.key === 'Escape') { setOpen(false); inputRef.current?.blur(); }
      };

      return (
        <div ref={wrapperRef} style={pickS.wrapper}>
          <div style={pickS.inputArea} onClick={() => inputRef.current?.focus()}>
            {selectedGenres.map(g => (
              <span key={g.slug} style={pickS.tag}>
                {g.name}
                <button onClick={(e) => { e.stopPropagation(); onToggle(g.slug); }}
                  style={pickS.tagRemove} aria-label={'Remove ' + g.name}>×</button>
              </span>
            ))}
            <input ref={inputRef} value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)} onKeyDown={handleKeyDown}
              placeholder={selectedSlugs.length === 0 ? 'Search genres...' : 'Add more...'}
              style={pickS.input} aria-label="Search genres" />
          </div>
          {open && filtered.length > 0 && (
            <div style={pickS.dropdown}>
              {filtered.slice(0, 20).map((g, i) => (
                <div key={g.slug}
                  onClick={() => { onToggle(g.slug); setQuery(''); inputRef.current?.focus(); }}
                  onMouseEnter={() => setHighlightIdx(i)}
                  style={{ ...pickS.dropdownItem, ...(i === highlightIdx ? { background: '#f5f5f5' } : {}) }}>
                  {g.name}
                </div>
              ))}
              {filtered.length > 20 && (
                <div style={{ padding: '8px 16px', fontSize: '12px', color: '#999', borderTop: '1px solid #eee' }}>
                  {filtered.length - 20} more — keep typing to narrow down
                </div>
              )}
            </div>
          )}
          {open && query.trim() && filtered.length === 0 && (
            <div style={pickS.dropdown}>
              <div style={{ padding: '12px 16px', fontSize: '13px', color: '#999' }}>No genres match "{query}"</div>
            </div>
          )}
        </div>
      );
    }

      const toggleGenre = useCallback((slug) => {
        setSelectedSlugs(prev => prev.includes(slug) ? prev.filter(s => s !== slug) : [...prev, slug]);

        if (selectedSlugs.length === 0) return;
        setNoResults(false); setError(null);

      }, [selectedSlugs, onNavigate]);

    // -----------------------------------------------------------------------
    // Fake waveform generator
    // -----------------------------------------------------------------------
    function Waveform() {
      const bars = useMemo(() => {
        const b = [];
        for (let i = 0; i < 200; i++) {
          const h = 8 + Math.random() * 52 + Math.sin(i * 0.08) * 15 + Math.sin(i * 0.03) * 10;
          b.push(Math.max(6, Math.min(65, h)));
        }
        return b;
      }, []);
      return (
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: '1.5px', height: '70px', width: '100%' }}>
          {bars.map((h, i) => (
            <div key={i} style={{
              flex: 1, height: h + '%', minWidth: '2px',
              background: i < 140 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.25)',
              borderRadius: '1px',
            }} />
          ))}
        </div>
      );
    }

                <a href="#" style={{ fontSize: '13px', color: '#1a1a1a', textDecoration: 'none' }}>See all</a>
              </div>
              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                {Array.from({ length: 7 }).map((_, i) => (
                  <div key={i} style={{
                    width: '44px', height: '44px', borderRadius: '50%',
                    background: ['#e8a0c0','#607080','#90b060','#c0a070','#6080c0','#d06060','#50a0a0'][i],
                  }} />
                ))}
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '24px', marginBottom: '12px' }}>
                <span style={{ fontWeight: 600, fontSize: '14px' }}>Favorited by ({fakeFavs})</span>
                <a href="#" style={{ fontSize: '13px', color: '#1a1a1a', textDecoration: 'none' }}>See all</a>
              </div>
              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                {Array.from({ length: 5 }).map((_, i) => (
                  <div key={i} style={{
                    width: '44px', height: '44px', borderRadius: '50%',
                    background: ['#a080d0','#d0a050','#50b0a0','#c07070','#7090c0'][i],
                  }} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const sp = {
      hero: { background: '#1a1a1a', padding: '0' },
      heroInner: {
        display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
        padding: '40px 40px 24px', gap: '24px',
      },
      heroLeft: { display: 'flex', alignItems: 'flex-start', gap: '20px', flex: 1 },
      playBtn: {
        width: '72px', height: '72px', borderRadius: '50%', background: '#fff',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', flexShrink: 0, paddingLeft: '4px',
      },
      heroTitle: { fontSize: '24px', fontWeight: 700, color: '#fff', margin: '0 0 8px', lineHeight: 1.2 },
      heroStats: { fontSize: '13px', color: '#ccc', display: 'flex', flexWrap: 'wrap', gap: '0', alignItems: 'center' },
      dot: { margin: '0 8px', color: '#666' },
      artworkWrap: { flexShrink: 0 },
      artwork: {
        width: '200px', height: '200px', borderRadius: '4px', background: '#f0f0f0',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      actions: {
        display: 'flex', gap: '8px', padding: '0 40px 24px',
        alignItems: 'center',
      },
      actionBtn: {
        display: 'flex', alignItems: 'center', gap: '6px',
        padding: '8px 18px', borderRadius: '24px', border: '1px solid #444',
        background: 'transparent', color: '#fff', fontSize: '13px', fontWeight: 500,
        cursor: 'pointer', whiteSpace: 'nowrap',
      },
      moreBtn: {
        width: '38px', height: '38px', borderRadius: '50%', border: '1px solid #444',
        background: 'transparent', color: '#fff', fontSize: '18px',
        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      waveformWrap: {
        position: 'relative', padding: '0 40px 8px', background: '#1a1a1a',
      },
      duration: {
        position: 'absolute', bottom: '12px', right: '44px',
        color: '#999', fontSize: '12px',
      },
      commentBar: {
        display: 'flex', alignItems: 'center', gap: '12px',
        padding: '12px 40px', background: '#2a2a2a',
      },
      commentAvatar: {
        width: '32px', height: '32px', borderRadius: '50%', background: '#f0f0f0',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: '8px', fontWeight: 800, color: '#1a1a1a', flexShrink: 0,
      },
      creatorSection: {
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '20px 40px', background: '#f5f5f5', borderBottom: '1px solid #eee',
      },
      creatorLeft: { display: 'flex', alignItems: 'center', gap: '14px' },
      creatorAvatar: {
        width: '52px', height: '52px', borderRadius: '50%', background: '#e0e0e0',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      creatorName: { fontSize: '16px', fontWeight: 700, color: '#1a1a1a', margin: 0 },
      creatorFollowers: { fontSize: '13px', color: '#999', margin: '2px 0 0' },
      followingBtn: {
        display: 'flex', alignItems: 'center', gap: '6px',
        padding: '8px 18px', borderRadius: '6px', border: '1px solid #ddd',
        background: '#fff', color: '#1a1a1a', fontSize: '13px', fontWeight: 600,
        cursor: 'pointer',
      },
      belowCreator: {
        display: 'flex', gap: '40px', padding: '28px 40px',
      },
      mainCol: { flex: 1 },
      sideCol: { width: '280px', flexShrink: 0 },
      tagRow: { display: 'flex', flexWrap: 'wrap', gap: '8px' },
      tagChip: {
        display: 'inline-block', padding: '6px 16px', borderRadius: '20px',
        border: '1px solid #ddd', background: '#fff', color: '#1a1a1a',
        fontSize: '13px', textTransform: 'capitalize',
      },
      discoverBtn: {
        padding: '10px 24px', borderRadius: '6px', border: 'none',
        background: '#1a1a1a', color: '#fff', fontSize: '14px', fontWeight: 600, cursor: 'pointer',
      },
      backBtn: {
        padding: '10px 24px', borderRadius: '6px', border: '1px solid #ddd',
        background: '#fff', color: '#1a1a1a', fontSize: '14px', fontWeight: 500, cursor: 'pointer',
      },
    };

    // -----------------------------------------------------------------------
    // App (with shell)
    // -----------------------------------------------------------------------
    function App() {
      const [page, setPage] = useState('home');
      const [showData, setShowData] = useState(null);

      const handleNavigate = useCallback((target, data) => {
        if (target === 'show') { setShowData(data); setPage('show'); }
        else { setPage('home'); }
        window.scrollTo(0, 0);
      }, []);

      const showSidebar = page === 'home';

      return (
        <div style={{ minHeight: '100vh' }}>
          <TopHeader />
          {showSidebar && <Sidebar activePage="genres" />}
          <div style={{ marginLeft: showSidebar ? '88px' : '0', marginTop: '56px' }}>
            {page === 'home' && <GenresPage onNavigate={handleNavigate} />}
            {page === 'show' && showData && <ShowPage show={showData} onNavigate={handleNavigate} key={showData.slug} />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
