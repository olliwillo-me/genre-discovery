{% verbatim %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genres &amp; Tags</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1a1a1a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    @keyframes pulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useCallback, useEffect, useRef, useMemo } = React;

    async function gqlQuery(query, variables = {}) {
      const resp = await fetch('/graphql/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      const json = await resp.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }

    const GENRE_LIST_QUERY = `
      query GenreList {
        tags(tagType: "genre", first: 500) { id name slug }
      }
    `;

    const DISCOVER_SHOWS_QUERY = `
      query DiscoverShows($genreSlugs: [String!]!, $limit: Int) {
        discoverShows(genreSlugs: $genreSlugs, limit: $limit) {
          id slug name
          ownerInfo { username displayName }
          qualityScore playCount publishDate
          tagList { name slug }
        }
      }
    `;

    const TOP_GENRES = [
      'afrobeats','ambient','bass-club-music','blues','chillout',
      'classical','country','dancehall','disco','drum-and-bass',
      'dub','dubstep','edm','folk','funk','garage-ukg','hardcore',
      'hip-hop','house','jazz','jungle','metal','pop','punk',
      'rb','reggae','reggaeton','rock','soul','techno','trance',
    ];

    // -----------------------------------------------------------------------
    // SVG Icons
    // -----------------------------------------------------------------------
    const Icons = {
      search: (props) => <svg width={props.size||18} height={props.size||18} viewBox="0 0 24 24" fill="none" stroke={props.color||"#999"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      home: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      live: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4.93 19.07A10 10 0 0119.07 4.93"/><path d="M7.76 16.24a6 6 0 018.49-8.49"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>,
      genres: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
      trending: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
      library: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="6" x2="4" y2="18"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="14" y1="6" x2="14" y2="18"/><line x1="19" y1="8" x2="19" y2="16"/></svg>,
      community: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>,
      bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>,
      mail: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
      plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      menu: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
      chevron: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
    };

    // -----------------------------------------------------------------------
    // Top Header Bar
    // -----------------------------------------------------------------------
    function TopHeader() {
      return (
        <header style={headerS.bar}>
          <div style={headerS.left}>
            <a href="#" style={headerS.logo}>M→XCLOUD</a>
            <div style={headerS.searchWrap}>
              <Icons.search size={16} color="#999" />
              <input placeholder="Search" style={headerS.searchInput} />
            </div>
          </div>
          <div style={headerS.right}>
            <button style={headerS.navBtn}>Listen <Icons.chevron /></button>
            <button style={headerS.navBtn}>Creator tools <Icons.chevron /></button>
            <button style={headerS.navBtn}>Plans <Icons.chevron /></button>
            <button style={headerS.createBtn}><Icons.plus /> Create</button>
            <div style={{ position: 'relative', display: 'flex' }}>
              <button style={headerS.iconBtn}><Icons.bell /></button>
              <span style={headerS.badge}>6</span>
            </div>
            <button style={headerS.iconBtn}><Icons.mail /></button>
            <div style={headerS.avatarGroup}>
              <div style={{ ...headerS.avatar, background: '#e8a030' }} />
              <div style={{ ...headerS.avatar, background: '#c050e0' }} />
            </div>
            <button style={headerS.iconBtn}><Icons.menu /></button>
          </div>
        </header>
      );
    }

    const headerS = {
      bar: {
        position: 'fixed', top: 0, left: 0, right: 0, height: '56px', zIndex: 200,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 20px', background: '#fff', borderBottom: '1px solid #eee',
      },
      left: { display: 'flex', alignItems: 'center', gap: '16px' },
      logo: {
        fontWeight: 800, fontSize: '18px', color: '#1a1a1a', textDecoration: 'none',
        letterSpacing: '-0.5px', whiteSpace: 'nowrap',
      },
      searchWrap: {
        display: 'flex', alignItems: 'center', gap: '8px',
        background: '#f5f5f5', borderRadius: '6px', padding: '7px 14px',
        width: '200px',
      },
      searchInput: {
        border: 'none', outline: 'none', background: 'transparent',
        fontSize: '13px', color: '#1a1a1a', width: '100%',
      },
      right: { display: 'flex', alignItems: 'center', gap: '6px' },
      navBtn: {
        display: 'flex', alignItems: 'center', gap: '4px',
        background: 'none', border: 'none', cursor: 'pointer',
        fontSize: '13px', fontWeight: 500, color: '#1a1a1a', padding: '6px 10px',
        whiteSpace: 'nowrap',
      },
      createBtn: {
        display: 'flex', alignItems: 'center', gap: '4px',
        background: 'none', border: '1.5px solid #1a1a1a', borderRadius: '20px',
        cursor: 'pointer', fontSize: '13px', fontWeight: 600, color: '#1a1a1a',
        padding: '6px 14px', whiteSpace: 'nowrap',
      },
      iconBtn: {
        background: 'none', border: 'none', cursor: 'pointer', color: '#1a1a1a',
        padding: '6px', display: 'flex', alignItems: 'center',
      },
      badge: {
        position: 'absolute', top: '0', right: '-2px',
        background: '#e53935', color: '#fff', fontSize: '10px', fontWeight: 700,
        borderRadius: '10px', padding: '1px 5px', lineHeight: '14px',
      },
      avatarGroup: { display: 'flex', gap: '0', marginLeft: '4px' },
      avatar: {
        width: '28px', height: '28px', borderRadius: '50%',
        border: '2px solid #fff', marginLeft: '-6px',
      },
    };

    // -----------------------------------------------------------------------
    // Left Sidebar
    // -----------------------------------------------------------------------
    function Sidebar({ activePage }) {
      const NAV = [
        { id: 'home', label: 'Home', icon: Icons.home },
        { id: 'live', label: 'Live now', icon: Icons.live },
        { id: 'genres', label: 'Genres', icon: Icons.genres },
        { id: 'trending', label: 'Trending', icon: Icons.trending },
        { id: 'library', label: 'Library', icon: Icons.library },
        { id: 'community', label: 'Community', icon: Icons.community },
      ];

      const LIVE_USERS = [
        { color: '#d32f2f', label: 'R 303', live: true },
        { color: '#c8e600', label: '', live: true },
        { color: '#333', label: '', live: true },
        { color: '#e8c0a0', label: '', live: false },
        { color: '#b0d860', label: '', live: false },
        { color: '#4caf50', label: '', live: false },
        { color: '#5060ff', label: '', live: false },
        { color: '#e040a0', label: '', live: false },
        { color: '#f0d020', label: '', live: false },
      ];

      return (
        <nav style={sideS.bar}>
          <div style={sideS.navItems}>
            {NAV.map(item => {
              const active = item.id === activePage;
              return (
                <a key={item.id} href="#" style={{
                  ...sideS.navItem,
                  color: active ? '#1a1a1a' : '#888',
                  fontWeight: active ? 600 : 400,
                }} onClick={(e) => e.preventDefault()}>
                  <item.icon />
                  <span style={sideS.navLabel}>{item.label}</span>
                </a>
              );
            })}
          </div>
          <div style={sideS.liveSection}>
            {LIVE_USERS.map((u, i) => (
              <div key={i} style={{ position: 'relative', display: 'flex', justifyContent: 'center' }}>
                <div style={{ ...sideS.userAvatar, background: u.color }}>
                  {u.label && <span style={{ fontSize: '8px', fontWeight: 700, color: '#fff' }}>{u.label}</span>}
                </div>
                {u.live && <span style={sideS.liveBadge}>LIVE</span>}
              </div>
            ))}
          </div>
        </nav>
      );
    }

    const sideS = {
      bar: {
        position: 'fixed', top: '56px', left: 0, bottom: 0, width: '88px',
        background: '#fff', borderRight: '1px solid #eee', zIndex: 150,
        display: 'flex', flexDirection: 'column',
        overflowY: 'auto',
      },
      navItems: {
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        paddingTop: '12px', gap: '4px',
      },
      navItem: {
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px',
        textDecoration: 'none', padding: '10px 8px', borderRadius: '8px',
        fontSize: '11px', cursor: 'pointer', width: '72px', textAlign: 'center',
        transition: 'background 0.1s',
      },
      navLabel: { lineHeight: '1.2' },
      liveSection: {
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        gap: '8px', paddingTop: '16px', borderTop: '1px solid #eee',
        marginTop: '8px', paddingBottom: '16px',
      },
      userAvatar: {
        width: '44px', height: '44px', borderRadius: '50%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      liveBadge: {
        position: 'absolute', bottom: '-2px',
        background: '#4caf50', color: '#fff', fontSize: '8px', fontWeight: 700,
        borderRadius: '4px', padding: '1px 4px', lineHeight: '12px',
        border: '1.5px solid #fff',
      },
    };

    // -----------------------------------------------------------------------
    // Genre Search Bar (in page content)
    // -----------------------------------------------------------------------
    function GenreSearchBar({ genres, onSelect }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const [highlightIdx, setHighlightIdx] = useState(0);
      const inputRef = useRef(null);
      const wrapperRef = useRef(null);

      const filtered = useMemo(() => {
        if (!query.trim()) return [];
        const q = query.toLowerCase();
        return genres.filter(g => g.name.toLowerCase().includes(q)).slice(0, 12);
      }, [genres, query]);

      useEffect(() => { setHighlightIdx(0); }, [filtered]);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); }
        else if (e.key === 'Enter' && filtered[highlightIdx]) { e.preventDefault(); onSelect(filtered[highlightIdx].slug); setQuery(''); setOpen(false); }
        else if (e.key === 'Escape') { setOpen(false); }
      };

      return (
        <div ref={wrapperRef} style={{ position: 'relative', marginBottom: '24px' }}>
          <div style={searchBarS.bar}>
            <Icons.search size={18} color="#999" />
            <input ref={inputRef} value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => { if (query.trim()) setOpen(true); }}
              onKeyDown={handleKeyDown}
              placeholder="Search for a genre or tag" style={searchBarS.input} />
          </div>
          {open && filtered.length > 0 && (
            <div style={searchBarS.dropdown}>
              {filtered.map((g, i) => (
                <div key={g.slug}
                  onClick={() => { onSelect(g.slug); setQuery(''); setOpen(false); }}
                  onMouseEnter={() => setHighlightIdx(i)}
                  style={{ ...searchBarS.dropdownItem, ...(i === highlightIdx ? { background: '#f5f5f5' } : {}) }}>
                  {g.name}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const searchBarS = {
      bar: { display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '8px', border: '1px solid #ddd', background: '#fff' },
      input: { flex: 1, border: 'none', outline: 'none', background: 'transparent', fontSize: '15px', color: '#1a1a1a' },
      dropdown: { position: 'absolute', top: '100%', left: 0, right: 0, marginTop: '4px', background: '#fff', border: '1px solid #ddd', borderRadius: '8px', maxHeight: '300px', overflowY: 'auto', zIndex: 100, boxShadow: '0 4px 16px rgba(0,0,0,0.1)' },
      dropdownItem: { padding: '10px 16px', cursor: 'pointer', fontSize: '14px', color: '#333' },
    };

    // -----------------------------------------------------------------------
    // Discovery genre picker (multi-select)
    // -----------------------------------------------------------------------
    function GenrePicker({ genres, selectedSlugs, onToggle }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const [highlightIdx, setHighlightIdx] = useState(0);
      const inputRef = useRef(null);
      const wrapperRef = useRef(null);

      const selectedGenres = useMemo(() => genres.filter(g => selectedSlugs.includes(g.slug)), [genres, selectedSlugs]);
      const filtered = useMemo(() => {
        const pool = genres.filter(g => !selectedSlugs.includes(g.slug));
        if (!query.trim()) return pool;
        return pool.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));
      }, [genres, query, selectedSlugs]);

      useEffect(() => { setHighlightIdx(0); }, [filtered]);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); }
        else if (e.key === 'Enter' && filtered[highlightIdx]) { e.preventDefault(); onToggle(filtered[highlightIdx].slug); setQuery(''); }
        else if (e.key === 'Backspace' && query === '' && selectedSlugs.length > 0) { onToggle(selectedSlugs[selectedSlugs.length - 1]); }
        else if (e.key === 'Escape') { setOpen(false); inputRef.current?.blur(); }
      };

      return (
        <div ref={wrapperRef} style={pickS.wrapper}>
          <div style={pickS.inputArea} onClick={() => inputRef.current?.focus()}>
            {selectedGenres.map(g => (
              <span key={g.slug} style={pickS.tag}>
                {g.name}
                <button onClick={(e) => { e.stopPropagation(); onToggle(g.slug); }}
                  style={pickS.tagRemove} aria-label={'Remove ' + g.name}>×</button>
              </span>
            ))}
            <input ref={inputRef} value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)} onKeyDown={handleKeyDown}
              placeholder={selectedSlugs.length === 0 ? 'Search genres...' : 'Add more...'}
              style={pickS.input} aria-label="Search genres" />
          </div>
          {open && filtered.length > 0 && (
            <div style={pickS.dropdown}>
              {filtered.slice(0, 20).map((g, i) => (
                <div key={g.slug}
                  onClick={() => { onToggle(g.slug); setQuery(''); inputRef.current?.focus(); }}
                  onMouseEnter={() => setHighlightIdx(i)}
                  style={{ ...pickS.dropdownItem, ...(i === highlightIdx ? { background: '#f5f5f5' } : {}) }}>
                  {g.name}
                </div>
              ))}
              {filtered.length > 20 && (
                <div style={{ padding: '8px 16px', fontSize: '12px', color: '#999', borderTop: '1px solid #eee' }}>
                  {filtered.length - 20} more — keep typing to narrow down
                </div>
              )}
            </div>
          )}
          {open && query.trim() && filtered.length === 0 && (
            <div style={pickS.dropdown}>
              <div style={{ padding: '12px 16px', fontSize: '13px', color: '#999' }}>No genres match "{query}"</div>
            </div>
          )}
        </div>
      );
    }

    const pickS = {
      wrapper: { position: 'relative', marginBottom: '16px', maxWidth: '500px' },
      inputArea: {
        display: 'flex', flexWrap: 'wrap', gap: '6px', alignItems: 'center',
        padding: '8px 12px', borderRadius: '24px', border: '1px solid #ccc',
        background: '#fff', minHeight: '44px', cursor: 'text',
      },
      tag: {
        display: 'inline-flex', alignItems: 'center', gap: '4px',
        padding: '4px 10px', borderRadius: '16px',
        background: '#1a1a1a', color: '#fff', fontSize: '13px', fontWeight: 500, whiteSpace: 'nowrap',
      },
      tagRemove: { background: 'none', border: 'none', color: 'rgba(255,255,255,0.7)', fontSize: '16px', cursor: 'pointer', padding: '0 2px', lineHeight: 1 },
      input: { flex: 1, minWidth: '120px', border: 'none', outline: 'none', background: 'transparent', color: '#1a1a1a', fontSize: '14px', padding: '4px 0' },
      dropdown: {
        position: 'absolute', top: '100%', left: 0, right: 0, marginTop: '4px',
        background: '#fff', border: '1px solid #ddd', borderRadius: '12px',
        maxHeight: '280px', overflowY: 'auto', zIndex: 100, boxShadow: '0 4px 16px rgba(0,0,0,0.1)',
      },
      dropdownItem: { padding: '10px 16px', cursor: 'pointer', fontSize: '14px', color: '#333' },
    };

    // -----------------------------------------------------------------------
    // Genres Page
    // -----------------------------------------------------------------------
    function GenresPage({ onNavigate }) {
      const [genres, setGenres] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedSlugs, setSelectedSlugs] = useState([]);
      const [discovering, setDiscovering] = useState(false);
      const [noResults, setNoResults] = useState(false);
      const [error, setError] = useState(null);

      useEffect(() => {
        gqlQuery(GENRE_LIST_QUERY)
          .then(data => { setGenres(data.tags || []); setLoading(false); })
          .catch(() => { setError('Failed to load genres.'); setLoading(false); });
      }, []);

      const topGenres = useMemo(() => TOP_GENRES.map(slug => genres.find(g => g.slug === slug)).filter(Boolean), [genres]);

      const toggleGenre = useCallback((slug) => {
        setSelectedSlugs(prev => prev.includes(slug) ? prev.filter(s => s !== slug) : [...prev, slug]);
        setNoResults(false);
      }, []);

      const handleGo = useCallback(() => {
        if (selectedSlugs.length === 0) return;
        setDiscovering(true); setNoResults(false); setError(null);
        sessionStorage.setItem('lastGenres', JSON.stringify(selectedSlugs));
        gqlQuery(DISCOVER_SHOWS_QUERY, { genreSlugs: selectedSlugs, limit: 20 })
          .then(data => {
            setDiscovering(false);
            const shows = data.discoverShows || [];
            if (shows.length > 0) {
              onNavigate('results', { shows, genreSlugs: selectedSlugs });
            } else { setNoResults(true); }
          })
          .catch(() => { setDiscovering(false); setError('Something went wrong.'); });
      }, [selectedSlugs, onNavigate]);

      const handleSearchSelect = useCallback((slug) => {
        setSelectedSlugs(prev => prev.includes(slug) ? prev : [...prev, slug]);
      }, []);

      if (loading) return <div style={pgS.content}><div style={{ background: '#eee', borderRadius: 4, width: 200, height: 32, animation: 'pulse 1.5s ease infinite' }} /></div>;

      return (
        <div style={pgS.content}>
          <h1 style={pgS.title}>Genres &amp; Tags</h1>
          <GenreSearchBar genres={genres} onSelect={handleSearchSelect} />
          <div style={pgS.chipGrid}>
            {topGenres.map(g => (
              <a key={g.slug} href="#"
                onClick={(e) => { e.preventDefault(); handleSearchSelect(g.slug); }}
                style={pgS.chip}
                onMouseEnter={(e) => { e.currentTarget.style.background = '#e8e8e8'; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = '#f0f0f0'; }}>
                {g.name.toLowerCase()}
              </a>
            ))}
          </div>
          <hr style={pgS.divider} />
          <h2 style={pgS.sectionTitle}>or let us find something for you</h2>
          <p style={pgS.sectionSub}>Choose one or more genres below and we'll find you a show to listen to</p>
          <GenrePicker genres={genres} selectedSlugs={selectedSlugs} onToggle={toggleGenre} />
          <button onClick={handleGo}
            disabled={selectedSlugs.length === 0 || discovering}
            style={{ ...pgS.goButton, ...(selectedSlugs.length === 0 || discovering ? pgS.goButtonDisabled : {}) }}>
            {discovering ? 'Finding...' : 'Go'}
          </button>
          {error && <p style={{ color: '#d32f2f', fontSize: 14, marginTop: 12 }}>{error}</p>}
          {noResults && <p style={{ color: '#999', fontSize: 14, marginTop: 12 }}>No shows found for that combination. Try fewer genres or different ones.</p>}
        </div>
      );
    }

    const pgS = {
      content: { padding: '32px 40px', maxWidth: '960px' },
      title: { fontSize: '28px', fontWeight: 700, color: '#1a1a1a', marginBottom: '24px' },
      chipGrid: { display: 'flex', flexWrap: 'wrap', gap: '8px' },
      chip: { display: 'inline-block', padding: '8px 18px', borderRadius: '20px', background: '#f0f0f0', color: '#1a1a1a', fontSize: '14px', textDecoration: 'none', transition: 'background 0.15s', whiteSpace: 'nowrap' },
      divider: { border: 'none', borderTop: '1px solid #e5e5e5', margin: '36px 0' },
      sectionTitle: { fontSize: '22px', fontWeight: 600, color: '#1a1a1a', marginBottom: '6px' },
      sectionSub: { fontSize: '14px', color: '#888', marginBottom: '20px' },
      goButton: { padding: '10px 28px', borderRadius: '6px', border: 'none', background: '#1a1a1a', color: '#fff', fontSize: '14px', fontWeight: 600, cursor: 'pointer' },
      goButtonDisabled: { opacity: 0.3, cursor: 'not-allowed' },
    };

    // -----------------------------------------------------------------------
    // Mini waveform for feed cards
    // -----------------------------------------------------------------------
    function MiniWaveform({ color = '#ccc' }) {
      const bars = useMemo(() => {
        const b = [];
        for (let i = 0; i < 120; i++) {
          const h = 10 + Math.random() * 50 + Math.sin(i * 0.1) * 15 + Math.sin(i * 0.04) * 10;
          b.push(Math.max(8, Math.min(70, h)));
        }
        return b;
      }, []);
      return (
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: '1px', height: '40px', width: '100%' }}>
          {bars.map((h, i) => (
            <div key={i} style={{
              flex: 1, height: h + '%', minWidth: '1.5px',
              background: color,
              borderRadius: '0.5px',
            }} />
          ))}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Time-ago helper
    // -----------------------------------------------------------------------
    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins + ' mins ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
      const months = Math.floor(days / 30);
      if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
      return Math.floor(months / 12) + ' years ago';
    }

    // -----------------------------------------------------------------------
    // Show Feed Card (Mixcloud-style)
    // -----------------------------------------------------------------------
    function ShowCard({ show }) {
      const tags = show.tagList || [];
      const plays = show.playCount ? Number(show.playCount).toLocaleString() : '0';
      const duration = useMemo(() => {
        const m = Math.floor(30 + Math.random() * 90);
        const s = Math.floor(Math.random() * 60);
        return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
      }, []);

      // deterministic color from name
      const hue = useMemo(() => {
        let h = 0;
        for (let i = 0; i < (show.name || '').length; i++) h = (h * 31 + show.name.charCodeAt(i)) & 0xffffff;
        return h % 360;
      }, [show.name]);

      return (
        <div style={fc.card}>
          <div style={fc.row}>
            {/* Album art */}
            <div style={{ ...fc.artwork, background: 'hsl(' + hue + ', 35%, 75%)' }}>
              <span style={{ fontSize: '36px', color: 'rgba(255,255,255,0.5)' }}>♫</span>
              <div style={fc.hqBadge}>HQ</div>
            </div>

            {/* Main content */}
            <div style={fc.content}>
              {/* Play button + creator + title */}
              <div style={fc.topRow}>
                <div style={fc.playBtn}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><polygon points="6,3 20,12 6,21" /></svg>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={fc.creatorLine}>
                    <span style={fc.creatorName}>{show.ownerInfo?.displayName || show.ownerInfo?.username || 'Unknown'}</span>
                    <span style={fc.dot}>•</span>
                    <span style={fc.timeAgo}>{timeAgo(show.publishDate)}</span>
                  </p>
                  <p style={fc.title}>{show.name}</p>
                </div>
              </div>

              {/* Waveform */}
              <div style={fc.waveformRow}>
                <MiniWaveform color="#d0d0d0" />
                <span style={fc.duration}>{duration}</span>
              </div>

              {/* Actions + tags */}
              <div style={fc.bottomRow}>
                <div style={fc.actions}>
                  <button style={fc.actionBtn}>♡ Favorite</button>
                  <button style={fc.actionBtn}>↗ Share</button>
                  <button style={fc.actionBtn}>⊕ Add To</button>
                  <span style={fc.playCount}>▷ {plays}</span>
                </div>
                <div style={fc.tags}>
                  {tags.map(t => (
                    <span key={t.slug} style={fc.tagChip}>{t.name.toLowerCase()}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const fc = {
      card: { borderBottom: '1px solid #eee', padding: '24px 0' },
      row: { display: 'flex', gap: '20px' },
      artwork: {
        width: '160px', height: '160px', borderRadius: '4px', flexShrink: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative',
      },
      hqBadge: {
        position: 'absolute', top: '8px', right: '8px',
        background: 'rgba(0,0,0,0.55)', color: '#fff', fontSize: '10px', fontWeight: 700,
        padding: '2px 6px', borderRadius: '3px',
      },
      content: { flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', minWidth: 0 },
      topRow: { display: 'flex', alignItems: 'flex-start', gap: '14px' },
      playBtn: {
        width: '44px', height: '44px', borderRadius: '50%', background: '#7b2ff2',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', flexShrink: 0, paddingLeft: '2px',
      },
      creatorLine: { fontSize: '13px', color: '#666', margin: '0 0 4px', display: 'flex', alignItems: 'center', gap: '0' },
      creatorName: { fontWeight: 600, color: '#1a1a1a' },
      dot: { margin: '0 6px', color: '#ccc' },
      timeAgo: { color: '#999' },
      title: { fontSize: '16px', fontWeight: 600, color: '#1a1a1a', margin: 0, lineHeight: 1.3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
      waveformRow: { position: 'relative', margin: '10px 0 6px' },
      duration: { position: 'absolute', top: '50%', right: '0', transform: 'translateY(-50%)', color: '#999', fontSize: '12px', background: '#fff', paddingLeft: '8px' },
      bottomRow: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
      actions: { display: 'flex', gap: '12px', alignItems: 'center' },
      actionBtn: {
        background: 'none', border: '1px solid #e0e0e0', borderRadius: '20px',
        padding: '5px 14px', fontSize: '12px', color: '#555', cursor: 'pointer',
        whiteSpace: 'nowrap',
      },
      playCount: { fontSize: '12px', color: '#999' },
      tags: { display: 'flex', gap: '6px', flexWrap: 'wrap', justifyContent: 'flex-end' },
      tagChip: {
        display: 'inline-block', padding: '4px 12px', borderRadius: '14px',
        border: '1px solid #e0e0e0', background: '#fff', color: '#555',
        fontSize: '12px', whiteSpace: 'nowrap',
      },
    };

    // -----------------------------------------------------------------------
    // Results Page (feed of shows)
    // -----------------------------------------------------------------------
    function ResultsPage({ results, genreSlugs, onNavigate }) {
      return (
        <div style={rp.content}>
          <div style={rp.header}>
            <div style={rp.playIcon}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#7b2ff2"><polygon points="5,3 19,12 5,21" /></svg>
            </div>
            <h1 style={rp.title}>Discover</h1>
          </div>
          <div style={rp.tabRow}>
            <span style={rp.tabActive}>Results</span>
            <button onClick={() => onNavigate('home')} style={rp.tabInactive}>Back to genres</button>
          </div>
          <p style={rp.subtitle}>{results.length} show{results.length !== 1 ? 's' : ''} matching your genres</p>
          <div>
            {results.map(show => (
              <ShowCard key={show.id} show={show} />
            ))}
          </div>
        </div>
      );
    }

    const rp = {
      content: { padding: '32px 40px', maxWidth: '960px' },
      header: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '20px' },
      playIcon: {
        width: '40px', height: '40px', borderRadius: '50%', background: '#f3ecff',
        display: 'flex', alignItems: 'center', justifyContent: 'center', paddingLeft: '2px',
      },
      title: { fontSize: '28px', fontWeight: 700, color: '#1a1a1a', margin: 0 },
      tabRow: { display: 'flex', gap: '8px', marginBottom: '16px' },
      tabActive: {
        display: 'inline-block', padding: '8px 20px', borderRadius: '20px',
        background: '#1a1a1a', color: '#fff', fontSize: '14px', fontWeight: 500,
      },
      tabInactive: {
        display: 'inline-block', padding: '8px 20px', borderRadius: '20px',
        background: '#f0f0f0', color: '#1a1a1a', fontSize: '14px', fontWeight: 500,
        border: 'none', cursor: 'pointer',
      },
      subtitle: { fontSize: '14px', color: '#999', marginBottom: '8px' },
    };

    // -----------------------------------------------------------------------
    // App (with shell)
    // -----------------------------------------------------------------------
    function App() {
      const [page, setPage] = useState('home');
      const [resultsData, setResultsData] = useState(null);

      const handleNavigate = useCallback((target, data) => {
        if (target === 'results') { setResultsData(data); setPage('results'); }
        else { setPage('home'); }
        window.scrollTo(0, 0);
      }, []);

      return (
        <div style={{ minHeight: '100vh' }}>
          <TopHeader />
          <Sidebar activePage={page === 'home' ? 'genres' : 'home'} />
          <div style={{ marginLeft: '88px', marginTop: '56px' }}>
            {page === 'home' && <GenresPage onNavigate={handleNavigate} />}
            {page === 'results' && resultsData && (
              <ResultsPage
                results={resultsData.shows}
                genreSlugs={resultsData.genreSlugs}
                onNavigate={handleNavigate}
              />
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
